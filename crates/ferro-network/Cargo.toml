[package]
name = "ferro-network"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Async Rust client for the UniFi Network local integration API."
build = "build.rs"

[features]
default = []
# Enables `TlsMode::AcceptInvalid`, which skips certificate verification.
# For consoles with a self-signed certificate you cannot pin.
insecure-tls = []

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
schemars = { workspace = true }
typify = { workspace = true }
syn = { workspace = true }
prettyplease = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
