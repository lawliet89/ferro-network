[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/lawliet89/ferro-network"
authors = ["Yong Wen Chua"]

# Shared dependency versions. Each phase adds the crates it starts using;
# member crates opt in with `<name> = { workspace = true }`.
[workspace.dependencies]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# doc strings reference snake_case identifiers and bare URLs throughout
doc_markdown = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
